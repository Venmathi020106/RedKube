[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redkube"
version = "0.1.0"
description = "Kubernetes security auditing and attack-path analysis lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
redkube = "redkube.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
